name: React CI

on:
  push:
    branches: ["main"]
    paths:
      - "react/**"
      - ".github/workflows/react-ci.yml"
  pull_request:
    paths:
      - "react/**"
      - ".github/workflows/react-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: npm audit
        run: npm run audit

      - name: Build
        run: npm run build

      - name: Bundle size
        run: node scripts/check-size.mjs
