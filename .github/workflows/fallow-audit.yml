name: Fallow Audit

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/fallow-audit.yml"

jobs:
  fallow-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run fallow audit
        run: npx --yes fallow audit --base "origin/${{ github.base_ref }}"
