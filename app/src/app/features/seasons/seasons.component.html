<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0" i18n>Seasons</h1>
  <kt-button icon="plus-lg" (clicked)="start()" i18n>New season</kt-button>
</div>

@if (editing(); as f) {
  <div class="card mb-4">
    <div class="card-body">
      <form #form="ngForm" (ngSubmit)="save(form)" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" i18n>Name</label>
            <input class="form-control" name="name" [(ngModel)]="f.name" required />
          </div>
          <div class="col-md-3">
            <label class="form-label" i18n>Start date</label>
            <input type="date" class="form-control" name="start_date" [(ngModel)]="f.start_date" required />
          </div>
          <div class="col-md-3">
            <label class="form-label" i18n>End date</label>
            <input type="date" class="form-control" name="end_date" [(ngModel)]="f.end_date" required />
          </div>
          <div class="col-md-3">
            <label class="form-label" i18n>Accent color</label>
            <input type="color" class="form-control form-control-color" name="accent_color" [(ngModel)]="f.accent_color" required />
          </div>
          <div class="col-md-3 align-self-center">
            <div class="form-check mt-3">
              <input type="checkbox" class="form-check-input" id="is_ongoing" name="is_ongoing" [(ngModel)]="f.is_ongoing" />
              <label class="form-check-label" for="is_ongoing" i18n>Ongoing</label>
            </div>
          </div>
        </div>
        <kt-form-error [message]="error()" />
        <div class="d-flex gap-2 mt-3">
          <kt-button type="submit" i18n>Save</kt-button>
          <kt-button variant="secondary" (clicked)="cancel()" i18n>Cancel</kt-button>
        </div>
      </form>
    </div>
  </div>
}

@if (seasons().length === 0) {
  <kt-empty-state icon="calendar-x" title="No seasons" message="Create one to get started." i18n-title i18n-message />
} @else {
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead><tr>
        <th i18n>Name</th>
        <th i18n>Start</th>
        <th i18n>End</th>
        <th i18n>Ongoing</th>
        <th class="text-end"></th>
      </tr></thead>
      <tbody>
        @for (s of seasons(); track s.id) {
          <tr>
            <td>
              <span class="d-inline-block rounded-circle me-2" style="width:10px;height:10px;" [style.backgroundColor]="s.accent_color"></span>
              {{ s.name }}
            </td>
            <td>{{ s.start_date }}</td>
            <td>{{ s.end_date }}</td>
            <td>@if (s.is_ongoing) { <span class="badge text-bg-success" i18n>Ongoing</span> }</td>
            <td class="text-end">
              <kt-button variant="outline-secondary" size="sm" icon="pencil" (clicked)="start(s)" />
              <kt-button variant="outline-danger" size="sm" icon="trash" (clicked)="remove(s)" />
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
