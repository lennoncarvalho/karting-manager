<div class="container my-4" style="max-width: 480px">
  <div class="card shadow-sm">
    <div class="card-header text-white">
      <h1 class="h5 mb-0" i18n>Reset password</h1>
    </div>
    <div class="card-body">
      @if (done()) {
        <div class="alert alert-success" i18n>
          Password updated. Redirecting to admin…
        </div>
      } @else {
        <p class="text-muted small mb-3" i18n>
          Enter a new password for your account. You must follow the link from
          the recovery e-mail in the same browser tab for this form to work.
        </p>

        @if (error()) {
          <div class="alert alert-danger">{{ error() }}</div>
        }

        <form (ngSubmit)="submit()" autocomplete="off">
          <div class="mb-3">
            <label class="form-label" for="rp-pw" i18n>New password</label>
            <input
              id="rp-pw"
              type="password"
              class="form-control"
              autocomplete="new-password"
              [value]="password()"
              (input)="setPassword($any($event.target).value)"
              [disabled]="busy()"
              required
              minlength="8"
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="rp-confirm" i18n>Confirm password</label>
            <input
              id="rp-confirm"
              type="password"
              class="form-control"
              autocomplete="new-password"
              [value]="confirm()"
              (input)="setConfirm($any($event.target).value)"
              [disabled]="busy()"
              required
              minlength="8"
            />
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a routerLink="/login" class="small" i18n>Back to login</a>
            <button type="submit" class="btn btn-primary" [disabled]="busy()">
              @if (busy()) {
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              }
              <ng-container i18n>Update password</ng-container>
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
