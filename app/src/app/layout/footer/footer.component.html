<footer class="mt-auto py-3 text-white" [style.backgroundColor]="'var(--kt-season-accent)'">
  <div class="container">
    <div class="row align-items-center g-3">
      <!-- Left column: credits + license + copyright -->
      <div class="col-12 col-md-8">
        <div class="d-flex flex-wrap align-items-center gap-2 small">
          <span i18n>Created by</span>
          <a
            class="text-white text-decoration-underline"
            href="https://www.linkedin.com/in/lennoncarvalho/"
            target="_blank"
            rel="noopener noreferrer"
          >Lennon Carvalho</a>
          <span class="opacity-75">·</span>
          <a
            class="text-white text-decoration-underline"
            href="https://github.com/lennoncarvalho/karting-manager/blob/main/LICENSE"
            target="_blank"
            rel="noopener noreferrer"
            i18n
          >MIT License</a>
          <span class="opacity-75">·</span>
          <span>© {{ year }} Lennon Carvalho</span>
        </div>
      </div>

      <!-- Right column: GitHub + flags -->
      <div class="col-12 col-md-4">
        <div class="d-flex justify-content-md-end align-items-center gap-2">
          <a
            href="https://github.com/lennoncarvalho/karting-manager"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-sm btn-outline-light d-inline-flex align-items-center"
            aria-label="GitHub repository"
          >
            <i class="bi bi-github"></i>
          </a>

          <ul class="list-inline mb-0">
            @for (l of locales; track l.code) {
              <li class="list-inline-item">
                <button
                  type="button"
                  class="btn btn-link btn-sm p-1 text-white"
                  (click)="switch(l.href)"
                  [attr.aria-label]="l.code"
                >
                  <kt-flag [locale]="l.code" />
                </button>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </div>
</footer>
