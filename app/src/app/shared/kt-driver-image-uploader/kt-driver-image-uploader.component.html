<div class="d-flex align-items-center gap-3">
  <kt-driver-image [src]="value()" [name]="name()" size="lg" />

  <div class="d-flex flex-column gap-2 flex-grow-1">
    <label class="btn btn-outline-secondary btn-sm mb-0 d-inline-flex align-items-center gap-2"
           [class.disabled]="busy()">
      <i class="bi bi-upload"></i>
      @if (busy()) {
        <span i18n>Uploading…</span>
      } @else if (value()) {
        <span i18n>Replace picture</span>
      } @else {
        <span i18n>Upload picture</span>
      }
      <input
        type="file"
        accept="image/*"
        class="visually-hidden"
        [disabled]="busy()"
        (change)="onFileSelected($event)"
      />
    </label>

    @if (value()) {
      <button
        type="button"
        class="btn btn-link btn-sm p-0 text-danger align-self-start"
        [disabled]="busy()"
        (click)="clear()"
        i18n
      >Remove picture</button>
    }

    @if (error()) {
      <div class="alert alert-danger py-1 px-2 mb-0 small" role="alert">{{ error() }}</div>
    }
  </div>
</div>
