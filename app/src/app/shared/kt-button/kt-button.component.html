<button
  [type]="type()"
  [class]="'btn btn-' + variant() + (size() === 'sm' ? ' btn-sm' : size() === 'lg' ? ' btn-lg' : '') + (fullWidth() ? ' w-100' : '') + (accent() ? ' kt-button--accent' : '')"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() ? 'true' : null"
  (click)="onClick($event)"
>
  @if (loading()) {
    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
  } @else if (icon()) {
    <i class="bi me-2" [class]="'bi-' + icon()" aria-hidden="true"></i>
  }
  <ng-content />
</button>
