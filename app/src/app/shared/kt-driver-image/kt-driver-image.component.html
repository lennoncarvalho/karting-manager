@if (src()) {
  <img
    [src]="src()"
    [alt]="name()"
    [width]="sizePx()"
    [height]="sizePx()"
    [class]="rounded() === 'circle' ? 'rounded-circle kt-driver-image' : 'rounded kt-driver-image'"
    loading="lazy"
    decoding="async"
  />
} @else {
  <span
    [class]="rounded() === 'circle' ? 'rounded-circle kt-driver-image kt-driver-image--placeholder' : 'rounded kt-driver-image kt-driver-image--placeholder'"
    [style.width.px]="sizePx()"
    [style.height.px]="sizePx()"
    [style.fontSize.px]="sizePx() * 0.4"
    [attr.aria-label]="name() || 'Driver'"
  >{{ initials() }}</span>
}
